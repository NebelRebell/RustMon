name: Build & Push Multi-Arch Docker Image
on:
  push:
    branches: [master]
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./rustmon
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rustmon:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rustmon:${{ github.ref_name }}
      - uses: docker/build-push-action@v5
        with:
          context: ./user-data-srv
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rustmon-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rustmon-service:${{ github.ref_name }}
